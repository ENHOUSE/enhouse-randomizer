
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GET BUZZED! — Audience Mode</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #29231a, #080808 75%);
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 24px; border-bottom: 2px solid #b88c42; }
    .logo { max-width: 200px; max-height: 100px; object-fit: contain; }
    h1 { color: #e9bc5b; font-size: clamp(32px, 5vw, 72px); }
    .stage {
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    .eyebrow { color: #e9bc5b; letter-spacing: 4px; }
    #question { font-size: clamp(30px, 5vw, 76px); max-width: 1200px; }
    #answer { color: #e9bc5b; font-size: clamp(28px, 4vw, 54px); }
    #scores { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
    .score { border: 1px solid #b88c42; padding: 18px; border-radius: 12px; }
    footer { padding: 24px; color: #a99a7c; }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="enhouse-logo.png" alt="EnHouse">
    <h1>GET BUZZED!</h1>
    <div class="eyebrow">AUDIENCE MODE</div>
  </header>
  <main class="stage">
    <p class="eyebrow" id="category">WELCOME TO GAME NIGHT</p>
    <div id="question">Waiting for the host to start the game...</div>
    <div id="answer" hidden></div>
  </main>
  <section id="scores"></section>
  <footer>ENHOUSE • WHERE MEMORIES MATTER</footer>
  <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyANUpRGYD1MLS-m-E0PnCrwzyBMrDReyoQ",
    authDomain: "enhouse-get-buzzed.firebaseapp.com",
    databaseURL: "https://enhouse-get-buzzed-default-rtdb.firebaseio.com",
    projectId: "enhouse-get-buzzed",
    storageBucket: "enhouse-get-buzzed.firebasestorage.app",
    messagingSenderId: "436362620995",
    appId: "1:436362620995:web:37e189236f11a53ea724f6"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
signInAnonymously(auth).catch(error => console.error("Audience sign-in failed:", error));
 const gameRef = ref(db, "sessions/demo");
auth.authStateReady().then(() => {
  if (!auth.currentUser) return;
onValue(gameRef, (snapshot) => {
  const game = snapshot.val();
  if (!game) return;

  if (game.category !== undefined) {
    document.getElementById("category").textContent = game.category;
  }

  if (game.question !== undefined) {
    document.getElementById("question").textContent = game.question;
  }

  const answer = document.getElementById("answer");
  if (game.showAnswer && game.answer !== undefined) {
    answer.textContent = game.answer;
    answer.hidden = false;
  } else {
    answer.hidden = true;
  }
});
});
</script>
</body>
</html>
