<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GET BUZZED! — Audience Mode</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#29231a,#080808 75%);color:#fff;font-family:Arial,sans-serif;text-align:center}header{padding:24px;border-bottom:2px solid #b88c42}.logo{max-width:200px;max-height:100px;object-fit:contain}h1{color:#e9bc5b;font-size:clamp(32px,5vw,72px)}.stage{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}.eyebrow{color:#e9bc5b;letter-spacing:4px}#question{font-size:clamp(30px,5vw,76px);max-width:1200px}#answer{color:#e9bc5b;font-size:clamp(28px,4vw,54px)}#scores{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:0 20px}.score{border:1px solid #b88c42;padding:18px;border-radius:12px;background:#1b1814;min-width:130px}.score strong{display:block;color:#e9bc5b;font-size:clamp(24px,3vw,38px);margin-top:7px}footer{padding:24px;color:#a99a7c}#awardBanner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,850px);padding:35px 25px;border:3px solid #e9bc5b;border-radius:22px;background:#15120c;box-shadow:0 0 0 100vmax #0009,0 0 65px #d9a94c80;z-index:10;font-size:clamp(32px,6vw,80px);font-weight:900;color:#e9bc5b;overflow-wrap:anywhere}#awardBanner[hidden]{display:none}
</style></head><body>
<header><img class="logo" src="enhouse-logo.png" alt="EnHouse"><h1>GET BUZZED!</h1><div class="eyebrow">AUDIENCE MODE</div></header>
<main class="stage"><p class="eyebrow" id="category">WELCOME TO GAME NIGHT</p><div id="question">Waiting for the host to start the game...</div><div id="answer" hidden></div></main>
<section id="scores"></section><div id="awardBanner" role="status" aria-live="polite" hidden></div><footer>ENHOUSE • WHERE MEMORIES MATTER</footer>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyANUpRGYD1MLS-m-E0PnCrwzyBMrDReyoQ",authDomain:"enhouse-get-buzzed.firebaseapp.com",databaseURL:"https://enhouse-get-buzzed-default-rtdb.firebaseio.com",projectId:"enhouse-get-buzzed",storageBucket:"enhouse-get-buzzed.firebasestorage.app",messagingSenderId:"436362620995",appId:"1:436362620995:web:37e189236f11a53ea724f6"};
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);
const banner=document.getElementById('awardBanner');let previousAwardId=null,initialized=false,bannerTimer=null;
signInAnonymously(auth).catch(error=>console.error('Audience sign-in failed:',error));
auth.authStateReady().then(()=>{if(!auth.currentUser)return;onValue(ref(db,'sessions/demo'),snapshot=>{
const game=snapshot.val();if(!game)return;
if(game.category!==undefined)document.getElementById('category').textContent=game.category;
if(game.question!==undefined)document.getElementById('question').textContent=game.question;
const answer=document.getElementById('answer');if(game.showAnswer&&game.answer!==undefined){answer.textContent=game.answer;answer.hidden=false}else answer.hidden=true;
const scores=document.getElementById('scores');scores.replaceChildren();if(Array.isArray(game.scores)){for(const p of game.scores){const card=document.createElement('div');card.className='score';const name=document.createElement('span');name.textContent=p.name??'Player';const value=document.createElement('strong');value.textContent=String(p.score??0);card.append(name,value);scores.appendChild(card)}}
const award=game.lastAward;const awardId=award?.id??null;
if(initialized&&awardId!==null&&awardId!==previousAwardId){clearTimeout(bannerTimer);banner.textContent=`${award.name} ${award.points>=0?'+':''}${award.points} POINT${Math.abs(award.points)===1?'':'S'}!`;banner.hidden=false;bannerTimer=setTimeout(()=>{banner.hidden=true},3000)}
if(awardId===null){clearTimeout(bannerTimer);banner.hidden=true}previousAwardId=awardId;initialized=true;
},error=>console.error('Audience sync failed:',error))});
</script></body></html>
