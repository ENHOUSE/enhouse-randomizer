
name: Audience Mode Preview

on:
  push:
    branches:
      - audience-mode-dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: audience-mode-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages

    steps:
      - name: Get development files
        uses: actions/checkout@v4

      - name: Package preview
        run: |
          mkdir -p preview
          cp audience-test.html preview/index.html
          cp audience.html preview/
          cp "buzzed 2.html" preview/
          cp apple-touch-icon.png preview/

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: get-buzzed-audience-preview
          path: preview/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview/

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true
